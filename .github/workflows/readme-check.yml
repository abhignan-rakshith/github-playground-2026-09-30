name: README check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check README content
        shell: bash
        run: |
          grep -Fx '# GitHub Playground' README.md
          grep -Fx '## Skills being practiced' README.md
          echo "README checks passed!"
